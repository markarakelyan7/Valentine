<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A little question 💗</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; overflow: hidden;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    background: radial-gradient(circle at top, #fff0f5, #ffd6e4 55%, #f8b8d0);
    color: #5b263c;
  }
  .card {
    width: min(100%, 430px); text-align: center; padding: 38px 26px;
    background: rgba(255,255,255,.88); border: 1px solid #fff;
    border-radius: 28px; box-shadow: 0 18px 55px rgba(133,45,83,.18);
    position: relative; z-index: 1;
  }
  .heart {
    font-size: 76px; line-height: 1; display: inline-block;
    animation: beat 1.1s infinite;
    filter: drop-shadow(0 7px 10px rgba(230,75,130,.2));
  }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.13); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }
  h1 { font-size: clamp(27px, 7vw, 36px); margin: 22px 0 10px; }
  p { color: #86556a; font-size: 16px; line-height: 1.55; margin: 0 0 25px; }
  .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button {
    border: 0; border-radius: 999px; padding: 13px 25px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  button:active { transform: scale(.96); }
  #yes { background: #e94f8b; color: white; box-shadow: 0 7px 18px #e94f8b55; }
  #later { background: #fff0f5; color: #9b5270; }
  #answer { min-height: 28px; margin-top: 22px; font-weight: 650; color: #c33f76; }
  .tiny { font-size: 12px; color: #b17b91; margin-top: 15px; }
  .float {
    position: fixed; bottom: -30px; font-size: 22px; opacity: .5;
    animation: rise linear infinite; pointer-events: none;
  }
  @keyframes rise { to { transform: translateY(-115vh) rotate(25deg); opacity: 0; } }
</style>
</head>
<body>
  <main class="card">
    <div class="heart" aria-hidden="true">💗</div>
    <h1>Will you be my girlfriend?</h1>
    <p>I have a little question for you…<br>Would you like to make this official? 😊</p>
    <div class="buttons">
      <button id="yes" onclick="sayYes()">Yes! 💖</button>
      <button id="later" onclick="sayLater()">I'd like to think about it</button>
    </div>
    <div id="answer" aria-live="polite"></div>
    <div class="tiny">Made with a little courage and a lot of heart ✨</div>
  </main>
<script>
function sayYes() {
  document.querySelector('h1').textContent = 'You just made my day! 💞';
  document.querySelector('p').innerHTML = 'I’m really happy you said yes. Thank you! 💗';
  document.querySelector('.heart').textContent = '💖';
  document.getElementById('answer').textContent = 'Here’s to something lovely, one day at a time.';
  for (let i = 0; i < 24; i++) {
    const el = document.createElement('span');
    el.textContent = ['💗','💕','💖','✨'][Math.floor(Math.random()*4)];
    el.style.cssText = `position:fixed;left:${Math.random()*100}vw;top:${Math.random()*100}vh;font-size:${18+Math.random()*22}px;pointer-events:none;animation:pop 1.8s ease-out forwards;z-index:5`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1900);
  }
}
function sayLater() {
  document.getElementById('answer').textContent = 'Of course — take your time. No pressure 💗';
}
const style = document.createElement('style');
style.textContent = '@keyframes pop { to { transform:translateY(-90px) scale(.5) rotate(35deg); opacity:0; } }';
document.head.appendChild(style);
for (let i=0; i<12; i++) {
  const el=document.createElement('span'); el.className='float'; el.textContent=['♡','♥','✧'][i%3];
  el.style.left=(Math.random()*100)+'vw'; el.style.animationDuration=(8+Math.random()*9)+'s';
  el.style.animationDelay=(-Math.random()*15)+'s'; document.body.appendChild(el);
}
</script>
</body>
</html>
